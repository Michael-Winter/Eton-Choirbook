<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eton Cadence Index</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@2.1.8/css/dataTables.dataTables.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.8/js/dataTables.min.js"></script>

<style>
body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  margin: 18px;
}
h1{ margin:0 0 6px 0; font-size:22px; }
.sub{ color:#444; margin:0 0 16px 0; }

.controls{
  display:grid;
  grid-template-columns: repeat(4, minmax(160px,1fr));
  gap:10px;
  margin:12px 0 14px;
}
.controls label{ font-size:12px; color:#333; display:block; margin-bottom:4px; }
.controls select,
.controls input,
.controls button{
  width:100%;
  padding:7px 8px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
}
.controls button{ background:#f8f8f8; cursor:pointer; }

.rowlink{ color:#0b57d0; cursor:pointer; text-decoration:underline; }
.pill{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid #ddd;
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal.open{ display:flex; }

.modal-card{
  background:#fff;
  border-radius:14px;
  width:100%;
  max-width:1200px;
  max-height:92vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid #eee;
}
.modal-title{ font-weight:600; }
.modal-close{
  border:0;
  background:#f2f2f2;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

.modal-body{
  padding:14px;
  overflow:auto;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}

.imgwrap{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:10px;
  max-height:75vh;
  overflow:auto;
}

.imgwrap img{
  display:block;
  max-width:100%;
  height:auto;
  max-height:75vh;
  object-fit:contain;
  margin:0 auto;
}

@media(max-width:900px){
  .controls{ grid-template-columns:repeat(2, minmax(160px,1fr)); }
}
</style>
</head>

<body>

<h1>Eton Cadence Index</h1>
<p class="sub">Filter, sort, and click a cadence to view its notated exemplar where available.</p>

<!-- Core categorical filters -->
<div class="controls">
  <div><label>E</label><select id="f_e"><option value="">All</option></select></div>
  <div><label>Composer</label><select id="f_comp"><option value="">All</option></select></div>
  <div><label>CadType</label><select id="f_type"><option value="">All</option></select></div>
  <div><label>Tone</label><select id="f_tone"><option value="">All</option></select></div>
  <div><label>Texture</label><select id="f_tex"><option value="">All</option></select></div>
  <div><label>Meter</label><select id="f_meter"><option value="">All</option></select></div>
  <div><label>CVFs</label><select id="f_cvfs"><option value="">All</option></select></div>
  <div><label>Cantizans</label><select id="f_cant"><option value="">All</option></select></div>
</div>

<!-- Text/number filters -->
<div class="controls">
  <div><label>Flags (free text)</label><input id="f_flags" placeholder="e.g. hangover"></div>
  <div><label>Title</label><input id="f_title" placeholder="e.g. Gaude virgo"></div>
  <div><label>Bar</label><input id="f_bar" placeholder="e.g. 120"></div>
  <div><label>&nbsp;</label><button id="clear">Clear</button></div>
</div>
